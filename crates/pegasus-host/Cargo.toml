[package]
name = "pegasus-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "Long-lived Pegasus backend host: owns sessions, terminals, git and runs; outlives the window."

[[bin]]
name = "pegasus-host"
path = "src/main.rs"

# Reads and merges the app's and the host's event logs (logs/events.ndjson, logs/host-events.ndjson).
[[bin]]
name = "pegasus-events"
path = "src/events_main.rs"

[dependencies]
brotli = "8"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pegasus-core = { path = "../pegasus-core" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "process", "fs"] }
tokio-stream = "0.1"

[dev-dependencies]
sha2 = "0.10"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
