[package]
name = "pegasus-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Read-only pi session store: index, context slices, tail follow. Library for the sidecar now, a Rune UI later."

[lib]
name = "pegasus_core"

[[bin]]
name = "pegasus-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
