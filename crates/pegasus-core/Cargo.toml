[package]
name = "pegasus-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pegasus core: host protocol schema and the read-only pi session store."

[lib]
name = "pegasus_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ts-rs = "12"
