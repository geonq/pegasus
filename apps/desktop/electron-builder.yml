appId: com.pi-gui.desktop
productName: Pegasus
copyright: Copyright 2026 geonq. Based on pi-gui, Copyright 2026 Matthew Lam
electronVersion: 43.7.11

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # Mermaid and its dependency tree are bundled into the renderer (out/renderer), so the
  # node_modules copies would only add ~170 MB to app.asar.
  - "!**/node_modules/@antfu/install-pkg/**"
  - "!**/node_modules/@braintree/sanitize-url/**"
  - "!**/node_modules/@chevrotain/cst-dts-gen/**"
  - "!**/node_modules/@chevrotain/gast/**"
  - "!**/node_modules/@chevrotain/regexp-to-ast/**"
  - "!**/node_modules/@chevrotain/types/**"
  - "!**/node_modules/@chevrotain/utils/**"
  - "!**/node_modules/@iconify/types/**"
  - "!**/node_modules/@iconify/utils/**"
  - "!**/node_modules/@mermaid-js/parser/**"
  - "!**/node_modules/@types/d3/**"
  - "!**/node_modules/@types/d3-axis/**"
  - "!**/node_modules/@types/d3-brush/**"
  - "!**/node_modules/@types/d3-chord/**"
  - "!**/node_modules/@types/d3-contour/**"
  - "!**/node_modules/@types/d3-dispatch/**"
  - "!**/node_modules/@types/d3-drag/**"
  - "!**/node_modules/@types/d3-dsv/**"
  - "!**/node_modules/@types/d3-ease/**"
  - "!**/node_modules/@types/d3-fetch/**"
  - "!**/node_modules/@types/d3-force/**"
  - "!**/node_modules/@types/d3-hierarchy/**"
  - "!**/node_modules/@types/d3-polygon/**"
  - "!**/node_modules/@types/d3-quadtree/**"
  - "!**/node_modules/@types/d3-random/**"
  - "!**/node_modules/@types/d3-scale-chromatic/**"
  - "!**/node_modules/@types/d3-selection/**"
  - "!**/node_modules/@types/d3-timer/**"
  - "!**/node_modules/@types/d3-transition/**"
  - "!**/node_modules/@types/d3-zoom/**"
  - "!**/node_modules/@types/trusted-types/**"
  - "!**/node_modules/@upsetjs/venn.js/**"
  - "!**/node_modules/chevrotain/**"
  - "!**/node_modules/cytoscape/**"
  - "!**/node_modules/cytoscape-cose-bilkent/**"
  - "!**/node_modules/cytoscape-fcose/**"
  - "!**/node_modules/d3/**"
  - "!**/node_modules/d3-axis/**"
  - "!**/node_modules/d3-brush/**"
  - "!**/node_modules/d3-chord/**"
  - "!**/node_modules/d3-contour/**"
  - "!**/node_modules/d3-dispatch/**"
  - "!**/node_modules/d3-drag/**"
  - "!**/node_modules/d3-dsv/**"
  - "!**/node_modules/d3-ease/**"
  - "!**/node_modules/d3-fetch/**"
  - "!**/node_modules/d3-force/**"
  - "!**/node_modules/d3-hierarchy/**"
  - "!**/node_modules/d3-polygon/**"
  - "!**/node_modules/d3-quadtree/**"
  - "!**/node_modules/d3-random/**"
  - "!**/node_modules/d3-sankey/**"
  - "!**/node_modules/d3-scale-chromatic/**"
  - "!**/node_modules/d3-selection/**"
  - "!**/node_modules/d3-timer/**"
  - "!**/node_modules/d3-transition/**"
  - "!**/node_modules/d3-zoom/**"
  - "!**/node_modules/dagre-d3-es/**"
  - "!**/node_modules/dayjs/**"
  - "!**/node_modules/dompurify/**"
  - "!**/node_modules/elkjs/**"
  - "!**/node_modules/es-toolkit/**"
  - "!**/node_modules/hachure-fill/**"
  - "!**/node_modules/iconv-lite/**"
  - "!**/node_modules/import-meta-resolve/**"
  - "!**/node_modules/katex/**"
  - "!**/node_modules/khroma/**"
  - "!**/node_modules/lodash-es/**"
  - "!**/node_modules/mermaid/**"
  - "!**/node_modules/package-manager-detector/**"
  - "!**/node_modules/path-data-parser/**"
  - "!**/node_modules/points-on-curve/**"
  - "!**/node_modules/points-on-path/**"
  - "!**/node_modules/roughjs/**"
  - "!**/node_modules/rw/**"
  - "!**/node_modules/safer-buffer/**"
  - "!**/node_modules/stylis/**"
  - "!**/node_modules/tinyexec/**"
  - "!**/node_modules/ts-dedent/**"
  - "!**/node_modules/uuid/**"
  # The pnpm collector drops this nested version in the hoisted layout.
  # Keep retry 0.12 for Pi's lockfile code; other consumers require root 0.13.
  - from: ../../node_modules/proper-lockfile/node_modules/retry
    to: node_modules/proper-lockfile/node_modules/retry
    filter:
      - "**/*"
  # The collector nests the newer SSO under Bedrock. Its token provider must
  # stay below SSO: Bedrock itself pins a different token-provider version.
  - from: ../../node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    to: node_modules/@aws-sdk/client-bedrock-runtime/node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    filter:
      - "**/*"

extraResources:
  - from: resources/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  icon: resources/icon.icns
  executableName: Pegasus
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-gui-notification-status-helper
      to: MacOS/pi-gui-notification-status-helper

linux:
  category: Development
  executableName: pi-gui
  maintainer: Matthew Lam <minghinmatthew.lam@gmail.com>
  vendor: pi-gui
  synopsis: Codex-style desktop app for the pi coding agent
  description: A native desktop interface for pi coding agent sessions, workspaces, and tools.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
  packageName: pi-gui
  packageCategory: devel
  priority: optional
  afterRemove: resources/linux/after-remove.sh
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libgbm1

win:
  icon: resources/icon.ico
  executableName: Pegasus
  # Keep icon/version metadata editing; signing is optional without credentials.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

toolsets:
  appimage: "1.0.2"

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  owner: geonq
  repo: pi-gui
